                    example: "Not Found"

  /definitions/{id}/formulaires:
    get:
      tags:
        - Définitions d'habilitations
      summary: Liste des formulaires disponibles pour une définition d'habilitation
      description: |
        Récupère la liste des formulaires disponibles pour une définition d'habilitation spécifique.

        L'utilisateur doit avoir un rôle développeur pour le type d'habilitation correspondant.
        Si l'utilisateur n'a pas accès à cette définition, une erreur 404 est retournée.

        Les formulaires permettent de créer des demandes d'habilitation avec différentes configurations, notamment pour préremplir des données afin de simplifier l'accès à différents cas d'usage bien identifiés.
      operationId: getAuthorizationDefinitionForms
      security:
        - OAuth2:
            - read_authorizations
      parameters:
        - name: id
          in: path
          required: true
          description: Identifiant unique de la définition d'habilitation
          schema:
            type: string
            example: api_entreprise
      responses:
        '200':
          description: Liste des formulaires récupérée avec succès
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuthorizationRequestForm'
              examples:
                single_stage_forms:
                  summary: Formulaires pour définition simple (API Entreprise)
                  value:
                    - uid: "api-entreprise"
                      name: "API Entreprise"
                      description: "Accédez aux informations et aux documents administratifs des entreprises"
                      use_case: null
                      prefilled?: false
                      data: ["cadre_juridique_nature", "cadre_juridique_url", "scopes"]
                    - uid: "api-entreprise-marches-publics"
                      name: "API Entreprise - Marchés publics"
                      description: "Formulaire spécialisé pour les marchés publics"
                      use_case: "Marchés publics"
                      prefilled?: true
                      data:
                        cadre_juridique_nature: "Marchés publics"
                        cadre_juridique_url: "https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000037703425/"
                        scopes:
                          - "entreprises"
                          - "etablissements"
                multi_stage_forms:
                  summary: Formulaires pour définition multi-étapes (API Impôt Particulier Sandbox)
                  value:
                    - uid: "api-impot-particulier-sandbox"
                      name: "API Impôt Particulier"
                      description: "Accédez aux données fiscales des particuliers en mode bac à sable"
                      use_case: null
                      prefilled?: false
                      data: ["intitule", "description", "destinataire_donnees_caractere_personnel", "duree_conservation_donnees_caractere_personnel", "duree_conservation_donnees_caractere_personnel_justification", "cadre_juridique_url", "cadre_juridique_nature", "date_prevue_mise_en_production", "volumetrie_approximative", "scopes"]
                      scopes: ["dgfip_annee_n_moins_1", "dgfip_rfr", "dgfip_sitfam", "dgfip_nbpart", "dgfip_pac"]
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Définition d'habilitation non trouvée ou accès non autorisé
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Not Found"

  /webhooks/{webhook_id}/attempts:
    get:
      tags:
        - Webhooks
      summary: Récupérer l'historique des appels d'un webhook
      description: |
        Récupère la liste des appels effectués pour un webhook spécifique.

        L'utilisateur doit avoir un rôle développeur pour la définition d'habilitation associée au webhook.
        Si l'utilisateur n'a pas accès à ce webhook, une erreur 404 est retournée.

        Les résultats sont triés par date de création décroissante (du plus récent au plus ancien).
      operationId: getWebhookAttempts
      security:
        - OAuth2:
            - read_webhooks
      parameters:
        - name: webhook_id
          in: path
          required: true
          description: Identifiant unique du webhook
          schema:
            type: integer
            example: 1
        - name: start_time
          in: query
          required: false
          description: Date de début pour filtrer les appels webhook (format ISO 8601)
          schema:
            type: string
            format: date-time
            example: "2024-01-01T00:00:00Z"
        - name: end_time
          in: query
          required: false
          description: Date de fin pour filtrer les appels webhook (format ISO 8601)
          schema:
            type: string
            format: date-time
            example: "2024-12-31T23:59:59Z"
        - name: limit
          in: query
          required: false
          description: Nombre maximum d'appels à récupérer (par défaut 100, maximum 100)
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Liste des appels webhook récupérée avec succès
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WebhookAttempt'
              examples:
                webhook_attempts:
                  summary: Exemple d'appels webhook
                  value:
                    - id: 123
                      event: "approve"
                      status_code: 200
                      response_body: '{"success": true}'
                      created_at: "2024-01-15T10:30:00Z"
                      authorization_request_id: 456
                    - id: 124
                      event: "submit"
                      status_code: 500
                      response_body: '{"error": "Internal Server Error"}'
                      created_at: "2024-01-15T11:00:00Z"
                      authorization_request_id: 457
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Webhook non trouvé ou accès non autorisé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

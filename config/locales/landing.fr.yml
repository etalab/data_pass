      wallet_teaser:
        kicker: Une autre démarche
        title: Votre organisation va utiliser le portefeuille européen ou y contribuer ?
        text: Le portefeuille européen d’identité numérique est une application mobile où chacun conserve ses attestations électroniques et choisit ce qu’il partage. Une organisation qui veut demander ces données à ses usagers s’enregistre d’abord au registre des parties utilisatrices. Les organisations qui délivrent des attestations dans le portefeuille s’y enregistreront aussi.
        button: Découvrir le registre du portefeuille européen
        phone:
          avatar: E
          organization: Exemple Vélos
          request: souhaite accéder à vos données
          data_label: Données demandées
          data_value: Nom, prénoms, date de naissance
          purpose_label: Pourquoi
          purpose_value: Créer votre compte client
          registered: Organisation enregistrée au registre français
          refuse: Refuser
          share: Partager
          caption: "Exemple fictif : dans son portefeuille, l’usager lit le nom de l’organisation, la donnée demandée et la finalité, puis accepte ou refuse."
      applicants:
        kicker: Vous cherchez des données pour votre service
        title: Accéder à des données publiques protégées
        lead: Pour utiliser une donnée protégée, vous demandez l’accès à l’administration qui la détient. DataPass porte votre demande jusqu’à elle et garde la trace de sa décision.
        roles:
          title: Qui fait quoi
          summary: Votre organisation demande, DataPass transmet la demande et garde la trace de la décision, l’administration décide et vous ouvre l’accès.
          software_vendor_title: Vous êtes éditeur de logiciel ?
          software_vendor_text: "L’habilitation appartient à votre client, pour sa mission : c’est lui qui la détient. Vous pouvez l’aider à faire sa demande, puis appeler l’API pour son compte quand l’administration le prévoit."
          organization_title: Votre organisation
          organization_text: décrit son usage, les données nécessaires et le texte qui l’autorise à y accéder.
          first_arrow: dépose la demande dans
          datapass_title: DataPass
          datapass_text: transmet la demande, garde la trace de la décision et publie l’habilitation accordée.
          second_arrow: transmet à
          administration_title: L’administration qui détient les données
          administration_text: instruit, valide ou refuse avec un motif.
          third_arrow: si elle valide, ouvre
          access_title: L’accès aux données
          access_text: votre service reçoit les données directement de l’administration, sans passer par DataPass.
        examples:
          title: Ce que les organisations demandent sur DataPass
          people:
            title: Des données sur des personnes
            text: Le quotient familial ou le statut boursier, pour calculer un tarif de cantine.
          companies:
            title: Des données sur des entreprises
            text: Les attestations fiscales et sociales, pour instruire une candidature à un marché public.
          identification:
            title: Des services d’identification
            text: FranceConnect ou ProConnect, pour que vos usagers se connectent à votre service.
          procedures:
            title: Des démarches transmises
            text: Les demandes d’actes d’état civil, reçues par la mairie compétente.
        steps:
          title: Les étapes
          find:
            title: Trouvez la donnée
            text: Partez de votre démarche sur Simplifions, ou cherchez dans le catalogue de data.gouv.fr. La fiche de la donnée indique si elle est en open data ou en accès restreint.
            open_data: "En open data, vous n’avez rien à demander : vous la réutilisez librement."
            simplifions: Explorer Simplifions
            simplifions_title: Explorer Simplifions - nouvelle fenêtre
            data_gouv: Chercher sur data.gouv.fr
            data_gouv_title: Chercher sur data.gouv.fr - nouvelle fenêtre
          request:
            title: Faites votre demande sur DataPass
            text: La fiche d’une donnée en accès restreint vous mène au formulaire DataPass de l’administration qui la détient. Vous y décrivez votre usage et le texte qui vous y autorise.
            legal_text: Ce texte est la loi, le décret ou l’arrêté qui confie à votre organisation la mission pour laquelle vous avez besoin de la donnée.
          decision:
            title: L’administration décide
            text_html: Elle instruit votre demande, puis l’accorde ou la refuse avec un motif. Si elle l’accorde, vous obtenez une <strong>habilitation</strong> et elle vous ouvre l’accès.
      why:
        kicker: Pourquoi DataPass ?
        title: Un cadre commun pour accéder aux données publiques protégées
        before_title: Avant
        before_text: Chaque administration organisait l’accès à ses données protégées à sa façon, souvent par des conventions signées une à une avec chaque organisation.
        framework_title: Un cadre commun
        framework_text_html: 'Pour les échanges de données entre administrations, le code des relations entre le public et l’administration fixe des règles communes : <a href="https://www.legifrance.gouv.fr/codes/section_lc/LEGITEXT000031366350/LEGISCTA000031367410/" target="_blank" rel="noopener" title="Articles L114-8 et suivants du CRPA sur Légifrance - nouvelle fenêtre">articles L114-8 et suivants<span class="fr-sr-only"> - nouvelle fenêtre</span></a>.'
        tool_title: Un outil pour l’appliquer
        tool_text: "La DINUM a créé DataPass pour mettre ce cadre en pratique : une demande aux rubriques communes, une décision prise et tracée par l’administration qui détient les données, des habilitations publiées."
      faq:
        title: Questions fréquentes
        applicants_title: Vous cherchez des données
        applicants:
          - question: Où trouver les données en accès restreint ?
            answer: 'Sur <a href="https://simplifions.data.gouv.fr/" target="_blank" rel="noopener" title="Simplifions - nouvelle fenêtre">Simplifions<span class="fr-sr-only"> - nouvelle fenêtre</span></a>, si vous partez d’une démarche, et sur <a href="https://www.data.gouv.fr/dataservices" target="_blank" rel="noopener" title="data.gouv.fr - nouvelle fenêtre">data.gouv.fr<span class="fr-sr-only"> - nouvelle fenêtre</span></a>, qui référence les données et API en accès restreint.'
          - question: Comment demander l’accès à une donnée ?
            answer: La fiche de la donnée vous mène au formulaire DataPass de l’administration qui la détient. Vous vous connectez avec ProConnect et vous décrivez votre usage.
          - question: Ai-je le droit de demander cette donnée ?
            answer: "Oui, si un texte (loi, décret, arrêté) confie à votre organisation une mission qui a besoin de cette donnée. Vous citez ce texte dans votre demande. L’administration qui détient la donnée vérifie ce point quand elle instruit : elle peut vous demander de préciser, et si elle refuse, elle vous donne le motif."
          - question: "Je suis éditeur de logiciel : puis-je demander pour mes clients ?"
            answer: Votre client fait la demande, pour sa mission, et c’est lui qui détient l’habilitation. Vous pouvez l’aider à la remplir. Pour certaines API, comme API Entreprise et API Particulier, vous appelez ensuite l’API pour son compte, avec un jeton éditeur.
          - question: DataPass me transmet-il les données ?
            answer: Non. DataPass transmet votre demande et garde la trace de la décision. Si l’administration vous habilite, elle vous ouvre l’accès à ses données ou à son service.
        administrations_title: Vous êtes une administration
        administrations:
          - question: Mes données passent-elles par DataPass ?
            answer: Non. Vous ouvrez l’accès vous-même, avec vos propres outils. DataPass porte la demande et la décision.
          - question: Qui instruit les demandes ?
            answer: Vos agents. Vous désignez qui instruit et qui consulte les demandes ; chacun se connecte avec ProConnect.
          - question: Puis-je modifier mon formulaire après sa mise en ligne ?
            answer: Oui, en le demandant à l’équipe DataPass.

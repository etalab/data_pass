openapi: 3.0.0
info:
  title: API DataPass
  description: |
    DataPass est un service de gestion des demandes d'habilitations pour accéder aux données et services de l'État.

    # Vocabulaire

    Les concepts manipulés par DataPass sont les suivants:
    - `Utilisateur` : Un utilisateur est un individu ayant un compte sur DataPass. Il peut être un demandeur ou un instructeur.
    - `Organisation` : Une organisation est un groupe d'utilisateurs représentée par un SIRET. Elle peut être une entreprise ou un service de l'État.
    - `Demande d'habilitation` : Les demandes d'habilitations représentent les données soumises via un formulaire par un demandeur. Une demande est liée à un type d'habilitation, un formulaire, une organisation et un utilisateur (le demandeur).
    - `Habilitation` : Une habilitation est un droit d'accès délivré à une organisation suite à la validation d'une demande par un instructeur.
    - `Définition d'habilitation` : Les demandes et les habilitations sont liées à une définition d'habilitation, qui définit les attributs de la demande.
    - `Formulaire` : Un formulaire définit l'interface de saisie des données d'une demande d'habilitation, avec ses éventuels champs pré-remplis en fonction des cas d'usage.

    # Identifiants

    L'interface affiche les identifiants avec un préfixe : `D` pour les demandes et `H` pour les habilitations (ex: `D123`, `H456`). L'API accepte les deux formats : avec ou sans préfixe (`123` ou `D123`).

    # Cycle de vie d'une demande

    Consultez [la documentation sur le cycle de vie d'une demande](https://github.com/etalab/data_pass/blob/main/docs/metier/lifecycle_documentation.md) pour comprendre comment les différents états d'une demande et de ses habilitations sont gérés.

    Pour le cas d'une habilitation avec étapes Bac à Sable et Production, consultez [la documentation sur le cycle de vie d'une demande avec étapes](https://github.com/etalab/data_pass/blob/main/docs/metier/lifecycle_documentation_with_stages.md) pour comprendre comment la transition d'étape est gérée.

    Des tutoriels sont aussi disponibles ici : https://datapass.api.gouv.fr/developpeurs/tutoriels

  version: 0.1.0
servers:
  - description: Production
    url: https://datapass.api.gouv.fr/api/v1
  - description: Staging
    url: https://staging.datapass.api.gouv.fr/api/v1
  - description: Sandbox
    url: https://sandbox.datapass.api.gouv.fr/api/v1

tags:
  - name: Authentification
    description: |
      Authentification via OAuth2:
        1. Obtenir un jeton OAuth2 via le endpoint `/oauth/token`
        2. Utiliser le jeton pour effectuer des requêtes à l'API

      A noter qu'un client OAuth2 est associé à un utilisateur, et que les types de demandes d'habilitations accessibles sont régies par les droits associés à cet utilisateur. Pour qu'un utilisateur puisse manipuler à travers l'API les demandes d'habilitations d'un certain type, il doit être référencé comme étant développeur pour ce type d'habilitation dans DataPass. Pour cela, il faut qu'un administrateur l'ajoute manuellement.

      Vous pouvez consulter les droits de développeurs que vous avez ainsi que votre `client_id` et `client_secret` sur [votre profil](https://datapass.api.gouv.fr/developpeurs/applications)
  - name: Demandes d'habilitations
    description: Les demandes d'habilitations représentent les données soumises via un formulaire par un demandeur. Une demande est liée à une définition, un formulaire, une organisation et un utilisateur (le demandeur).
  - name: Habilitations
    description: Les habilitations sont générées lors de la validation d'une demande d'habilitation par un instructeur. Elles contiennent les données de la demande au moment de la validation.
  - name: Définitions d'habilitations
    description: Les définitions d'habilitations décrivent les types d'habilitations disponibles, leurs caractéristiques, leurs étapes (sandbox/production) et les données auxquelles permettent d'accéder.
  - name: Événements
    description: Les événements représentent toutes les actions effectuées sur les demandes d'habilitations.
  - name: Utilisateurs
  - name: Webhooks
    description: Les webhooks permettent de recevoir des notifications sur les événements liés aux demandes d'habilitations.

security:
  - OAuth2:
      - read_authorizations

components:
  securitySchemes:
    OAuth2:
      type: oauth2
      description: |
        Authentification OAuth2 via le flow `client_credentials`. Le jeton obtenu sur `/oauth/token` est à transmettre dans l'en-tête `Authorization: Bearer …`.

        Les scopes accordés à un jeton sont définis au moment de sa demande. Chaque opération documente les scopes qu'elle exige.

        Une clef API créée depuis « Mes clefs d'accès API » peut demander `public`, `read_authorizations` et `read_webhooks`. `write_authorizations` est accordé au cas par cas, nous contacter.

        `submit_authorizations` et `validate_authorizations` ne peuvent pas être demandés par le développeur : un administrateur DataPass les accorde, par fournisseur de données, après qualification du parcours du fournisseur. Un appel dont le jeton ne porte pas le scope exigé, ou dont l'application n'a pas de droit actif pour le fournisseur de données du type d'habilitation, reçoit une réponse `403`. Un jeton émis avant l'octroi d'un droit ne porte pas le nouveau scope : demandez un nouveau jeton.
      flows:
        clientCredentials:
          tokenUrl: https://datapass.api.gouv.fr/api/v1/oauth/token
          scopes:
            public: Accès aux informations publiques de l'utilisateur courant (`/me`)
            read_authorizations: Lecture des demandes, habilitations, événements et définitions d'habilitations
            write_authorizations: Création et mise à jour des demandes d'habilitations via l'API
            submit_authorizations: Soumettre des demandes pour les fournisseurs de données autorisés
            validate_authorizations: Valider des demandes pour les fournisseurs de données autorisés
            read_webhooks: Lecture de l'historique des appels webhooks
  parameters:
    Authorization:
      name: Authorization
      in: header
      description: |
        Bearer token d'authentification obtenu via le endpoint OAuth2 `/oauth/token`.
      required: true
      schema:
        type: string
        example: "Bearer eyJhbGciOiJIUzI1NiJ9..."
  schemas:
    Demande:
      description: Demande d'habilitation
      properties:
        id:
          type: integer
          example: 123
          description: Identifiant unique de la demande
        public_id:
          type: string
          example: "ABC123"
          description: Identifiant public de la demande
        definition_id:
          type: string
          example: "api_entreprise"
          description: Identifiant de la définition d'habilitation associée à cette demande. Voir le endpoint `GET /definitions` pour la liste des définitions d'habilitations auxquelles vous avez accès.
        type:
          type: string
          example: "AuthorizationRequest::APIImpotParticulier"
          description: "**DÉPRÉCIÉ** - Type de la demande. Utilisez `definition_id` à la place pour identifier le type d'habilitation."
          deprecated: true
        state:
          type: string
          example: "submitted"
          description: État actuel de la demande. Plus de détails dans la [documentation sur le cycle de vie d'une demande](https://github.com/etalab/data_pass/blob/main/docs/lifecycle_documentation.md)
          enum:
            - draft
            - submitted
            - changes_requested
            - validated
            - refused
            - archived
            - revoked
        form_uid:
          type: string
          example: "api-particulier-cantine-de-france"
          description: Identifiant du formulaire utilisé pour la demande. Voir le endpoint `GET /definitions/{id}/formulaires` pour la liste des formulaires disponibles d'une définition d'habilitation.
        data:
          type: object
          description: Données remplies par le demandeur dans le formulaire.
          additionalProperties: true
        created_at:
          type: string
          format: date-time
          description: Date de création de la demande
        last_submitted_at:
          type: string
          format: date-time
          description: Date de la dernière soumission de la demande par le demandeur
          nullable: true
        last_validated_at:
          type: string
          format: date-time
          description: Date de la dernière validation de la demande par un instructeur
          nullable: true
        reopening:
          type: boolean
          description: Indique si la demande est en cours de réouverture
          example: false
        reopened_at:
          type: string
          format: date-time
          description: Date à laquelle la demande a été réouverte
          nullable: true
        metadata:
          $ref: '#/components/schemas/Metadata'
        meta:
          type: object
          description: Informations complémentaires sur la réponse. Présent uniquement lorsque l'appel appelle un avertissement.
          properties:
            warnings:
              type: array
              description: Avertissements non bloquants. L'appel a abouti, mais une partie de la demande n'a pas été appliquée.
              items:
                $ref: '#/components/schemas/Warning'
        organisation:
          $ref: '#/components/schemas/Organisation'
        applicant:
          $ref: '#/components/schemas/Utilisateur'
        service_provider:
          $ref: '#/components/schemas/ServiceProvider'
        habilitations:
          type: array
          description: Liste des habilitations associées à la demande.
          items:
            $ref: '#/components/schemas/Habilitation'
        events:
          type: array
          description: Liste des événements associés à la demande. L'événement de mise à jour global (`bulk_update`) n'est pas présent dans cette liste (pour des questions de performances).
          items:
            $ref: '#/components/schemas/AuthorizationRequestEvent'
      required:
        - id
        - public_id
        - definition_id
        - type
        - state
        - form_uid
        - data
        - created_at
        - organisation
        - applicant

    Metadata:
      type: object
      description: |
        Métadonnées libres posées par le fournisseur de données sur une demande, par exemple `{"campagne": "migration-editeur-x", "source": "api"}`. Elles sont restituées dans les réponses de l'API et dans la charge utile de chaque webhook de la demande.

        Elles ne sont visibles que des applications du fournisseur de données et des administrateurs DataPass, jamais du demandeur. Elles ne doivent contenir aucune donnée personnelle.

        Limites proposées, à confirmer à l'implémentation : 20 clés au maximum, clés de 40 caractères au maximum, valeurs textuelles de 500 caractères au maximum.

        À la mise à jour (`PATCH`), l'objet transmis remplace intégralement les métadonnées existantes ; `null` les supprime.
      nullable: true
      additionalProperties:
        oneOf:
          - type: string
          - type: number
          - type: boolean
      example:
        campagne: migration-editeur-x
        source: api

    Notifications:
      type: boolean
      default: true
      description: |
        Mettre à `false` pour ne pas envoyer les emails DataPass liés à cet appel (accusé de réception au demandeur, « nouvelle demande » aux instructeurs, emails aux contacts…), lorsque le contrat du fournisseur de données le permet.

        Si le contrat rend ces notifications obligatoires, le paramètre est ignoré : l'appel aboutit, les emails sont envoyés et la réponse contient un avertissement dans `meta.warnings`.

        Une valeur autre que `true` ou `false` est refusée avec une erreur `422`.

        Les webhooks sont toujours envoyés, quelle que soit la valeur. L'historique de la demande indique que les notifications ont été désactivées. La valeur effectivement appliquée (après prise en compte du contrat du fournisseur de données) est reprise dans le champ `notifications` de la charge utile du webhook déclenché par l'appel.

    Warning:
      type: object
      description: Avertissement non bloquant
      properties:
        title:
          type: string
          example: "Notifications obligatoires"
        detail:
          type: string
          example: "Le contrat de votre fournisseur de données rend les notifications obligatoires : le paramètre `notifications` a été ignoré."
      required:
        - title
        - detail

    Utilisateur:
      type: object
      description: Utilisateur associé à la demande ou à l'événement
      properties:
        id:
          type: integer
          example: 42
          description: Identifiant technique de l'utilisateur
        uid:
          type: string
          example: "5f2a9c1e-7b3d-4e8a-9a41-0c6d2f7b8e13"
          description: Identifiant du compte chez le fournisseur d'identité (ProConnect, champ `sub`). Identique à celui des webhooks. Absent tant que l'utilisateur ne s'est jamais connecté à DataPass.
          nullable: true
        email:
          type: string
          example: utilisateur@gouv.fr
          description: Adresse email de l'utilisateur
        given_name:
          type: string
          example: "Jean"
          description: Prénom de l'utilisateur
          nullable: true
        family_name:
          type: string
          example: "Dupont"
          description: Nom de famille de l'utilisateur
          nullable: true
        phone_number:
          type: string
          example: "0612345678"
          description: Numéro de téléphone de l'utilisateur
          nullable: true
        job_title:
          type: string
          example: "Responsable informatique"
          description: Fonction de l'utilisateur
          nullable: true
      required:
        - id
        - email

    Organisation:
      type: object
      description: Organisation associée à la demande
      properties:
        id:
          type: integer
          example: 51
          description: Identifiant technique de l'organisation
        siret:
          type: string
          example: "13002526500013"
          description: Numéro de SIRET de l'organisation
        name:
          type: string
          example: Direction interministérielle du numerique (DINUM)
          description: Raison sociale de l'organisation
          nullable: true
        insee_payload:
          type: object
          description: Données INSEE associées à l'organisation. Voir [la documentation sur l'API Sirene](https://portail-api.insee.fr/catalog/api/2ba0e549-5587-3ef1-9082-99cd865de66f?aq=ALL) et spécifiquement le endpoint `GET /siret/{siret}` de [le fichier Open API](https://api-apimanager.insee.fr/portal/environments/DEFAULT/apis/2ba0e549-5587-3ef1-9082-99cd865de66f/pages/6548510e-c3e1-3099-be96-6edf02870699/content) pour plus d'informations.
          additionalProperties: true
      required:
        - id
        - siret

    ServiceProvider:
      type: object
      nullable: true
      description: Prestataire de service associé au formulaire de la demande (Typiquement l'éditeur de logiciel au service d'une collectivité). `null` lorsque le formulaire n'est pas porté par un prestataire.
      properties:
        id:
          type: string
          example: "mgdis"
          description: Identifiant unique du prestataire de service
        siret:
          type: string
          example: "12345678901234"
          description: Numéro SIRET du prestataire. Absent pour les prestataires qui n'en ont pas (par exemple une plateforme mutualisée).
          nullable: true
        type:
          type: string
          example: "editor"
          description: Type de prestataire de service (`editor` ou `saas`)
      required:
        - id
        - type

    Habilitation:
      type: object
      description: Habilitation délivrée à une organisation
      properties:
        id:
          type: integer
          example: 789
          description: Identifiant unique de l'habilitation
        slug:
          type: string
          nullable: true
          example: "habilitation-123"
          description: Slug de l'habilitation
        revoked:
          type: boolean
          example: false
          description: Indique si l'habilitation a été révoquée. Ce booléen fait foi pour l'état révoqué de l'habilitation. (Une habilitation peut être `state:obsolete` et `revoked:true`).
        state:
          type: string
          example: "active"
          description: État de l'habilitation. L'état `obsolete` est utilisé pour indiquer que l'habilitation n'est plus active suite à la génération d'une nouvelle habilitation du même type par la même demande.
          enum:
            - active
            - obsolete
            - revoked
        created_at:
          type: string
          format: date-time
          description: Date de création de l'habilitation, correspondant à la date de validation de la demande d'habilitation par l'instructeur.
        data:
          type: object
          description: Données contenues dans la demande d'habilitation au moment de la validation par l'instructeur.
          additionalProperties: true
        authorization_request_class:
          type: string
          example: "AuthorizationRequest::APIParticulier"
          description: "**DÉPRÉCIÉ** - Classe de la demande d'autorisation associée à l'habilitation. Utilisez `definition_id` à la place pour identifier le type d'habilitation."
          deprecated: true
        definition_id:
          type: string
          example: "api_entreprise"
          description: Identifiant de la définition d'habilitation associée à cette habilitation. Voir le endpoint `GET /definitions` pour la liste des définitions d'habilitations auxquelles vous avez accès.
      required:
        - id
        - revoked
        - state
        - created_at
        - authorization_request_class
        - definition_id

    HabilitationDetailed:
      allOf:
        - $ref: "#/components/schemas/Habilitation"
        - type: object
          properties:
            request_id:
              type: integer
              example: 123
              description: Identifiant de la demande d'habilitation associée. Pour obtenir le détail de la demande, utilisez le endpoint `GET /demandes/{id}` avec `request_id` comme identifiant.
            organization:
              $ref: "#/components/schemas/Organisation"

    AuthorizationRequestEvent:
      type: object
      description: Événement associé à une demande d'habilitation
      properties:
        id:
          type: integer
          example: 1011
          description: Identifiant unique de l'événement
        name:
          type: string
          example: "approve"
          description: Nom de l'événement
          enum:
            - approve
            - archive
            - create
            - refuse
            - request_changes
            - revoke
            - submit
            - update
            - transfer
            - copy
            - reopen
            - cancel_reopening
            - applicant_message
            - instructor_message
            - admin_update
            - bulk_update
            - start_next_stage
            - system_reminder
            - system_archive
            - system_import
            - create_by_api
            - update_by_api
        created_at:
          type: string
          format: date-time
          description: Date et heure de l'événement
      required:
        - id
        - name
        - created_at

    Scope:
      type: object
      description: Scope (donnée) disponible pour une définition d'habilitation
      properties:
        name:
          type: string
          example: "Nom de famille"
          description: Nom humanisé de la donnée
        value:
          type: string
          example: "family_name"
          description: Nom technique de la donnée
        group:
          type: string
          example: "Identité pivot"
          description: Nom du groupe pour cette donnée afin d'effectuer un regroupement visuel
          nullable: true
        link:
          type: string
          example: "https://mon-api.gouv.fr/documentation/nom-de-famille"
          description: Lien vers des détails sur la donnée
          nullable: true
        included:
          type: boolean
          example: true
          description: Détermine si la donnée est forcément incluse. Cela permet d'afficher des données grisées et cochées à l'utilisateur pour l'informer que ces données seront disponibles avec son habilitation.
        disabled:
          type: boolean
          example: false
          description: Détermine si la donnée est désactivée. Cela permet d'afficher des données grisées et non cochées à l'utilisateur, ceci permet par exemple d'afficher des futures données disponibles ou plus disponibles.
        deprecated:
          type: boolean
          example: false
          description: Détermine si la donnée est dépréciée. Cela permet d'afficher les données dépréciées des demandes et habilitations passées.
        deprecated_date:
          type: string
          format: date
          description: Date de dépréciation de la donnée. Présent si `deprecated` est `true`.
          nullable: true
          example: "2025-05-20"
      required:
        - name
        - value
        - included
        - disabled

    ErrorResponse:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              status:
                type: string
                description: "Le code d'état HTTP associé à l'erreur."
                example: "422"
              source:
                type: object
                properties:
                  pointer:
                    type: string
                    description: "Un pointeur JSON indiquant le champ du payload à l'origine de l'erreur. Pour une donnée de formulaire, il a la forme `/data/<clé>` ; la clé est celle décrite par `GET /definitions/{id}`. Absent lorsque l'erreur ne concerne pas un champ précis (droit manquant, état de la demande, etc.)."
                    example: "/data/delegue_protection_donnees_family_name"
                required:
                  - pointer
              title:
                type: string
                description: "Un titre court pour l'erreur."
                example: "Validation Error"
              detail:
                type: string
                description: "Un message détaillé décrivant l'erreur."
                example: "Le nom ne peut pas être vide."
            required:
              - status
              - title
              - detail

    Me:
      type: object
      description: Informations sur l'utilisateur courant associé au jeton OAuth2
      properties:
        id:
          type: integer
          example: 42
          description: Identifiant technique de l'utilisateur
        email:
          type: string
          example: utilisateur@gouv.fr
          description: Adresse email de l'utilisateur
        family_name:
          type: string
          example: "Dupont"
          description: Nom de famille de l'utilisateur
          nullable: true
        given_name:
          type: string
          example: "Jean"
          description: Prénom de l'utilisateur
          nullable: true
        job_title:
          type: string
          example: "Responsable informatique"
          description: Titre du poste de l'utilisateur
          nullable: true
      required:
        - id
        - email

    AuthorizationDefinition:
      type: object
      description: Définition d'habilitation décrivant un type d'habilitation disponible
      properties:
        id:
          type: string
          example: "api_entreprise"
          description: Identifiant unique de la définition d'habilitation
        name:
          type: string
          example: "API Entreprise"
          description: Nom de la définition d'habilitation
        multi_stage?:
          type: boolean
          example: true
          description: Indique si cette définition fait partie d'un processus multi-étapes
        authorization_request_class:
          type: string
          example: "AuthorizationRequest::ApiImpotParticulier"
          description: "**DÉPRÉCIÉ** - Classe de demande d'autorisation associée à cette définition. Utilisez `definition_id` à la place pour identifier le type d'habilitation."
          deprecated: true
        consentements:
          type: array
          description: Cases de consentement à transmettre dans `consentement` à la soumission par API (`POST /demandes/{id}/soumettre`). Vide si le type d'habilitation n'en exige aucune.
          items:
            type: string
          example:
            - terms_of_service_accepted
            - data_protection_officer_informed
        scopes:
          type: array
          description: Liste des scopes disponibles pour cette définition d'habilitation avec leurs métadonnées complètes
          items:
            $ref: '#/components/schemas/Scope'
      required:
        - id
        - name
        - multi_stage?
        - authorization_request_class
        - scopes

    AuthorizationRequestForm:
      type: object
      description: Formulaire de demande d'habilitation associé à une définition d'habilitation
      properties:
        uid:
          type: string
          example: "api-entreprise"
          description: Identifiant unique du formulaire
        name:
          type: string
          example: "API Entreprise"
          description: Nom du formulaire
        description:
          type: string
          example: "Accédez aux informations et aux documents administratifs des entreprises"
          description: Description du formulaire
        use_case:
          type: string
          nullable: true
          example: null
          description: Cas d'utilisation du formulaire
        authorization_request_class:
          type: string
          example: "AuthorizationRequest::APIEntreprise"
          description: "**DÉPRÉCIÉ** - Classe de demande d'autorisation associée au formulaire. Utilisez `definition_id` à la place pour identifier le type d'habilitation."
          deprecated: true
        definition_id:
          type: string
          example: "api_entreprise"
          description: Identifiant de la définition d'habilitation associée à ce formulaire. Voir le endpoint `GET /definitions` pour la liste des définitions d'habilitations auxquelles vous avez accès.
        data:
          type: object
          description: Données préremplies du formulaire. Présent uniquement pour les formulaires avec prefilled? = true. Contient les valeurs par défaut pour certains champs du formulaire.
          additionalProperties: true
          example:
            cadre_juridique_nature: "Marchés publics"
            cadre_juridique_url: "https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000037703425/"
            scopes:
              - "entreprises"
              - "etablissements"
          nullable: true

    WebhookAttempt:
      type: object
      description: Appel webhook effectué suite à un événement sur une demande d'habilitation
      properties:
        id:
          type: integer
          example: 123
          description: Identifiant unique de l'appel webhook
        event:
          type: string
          example: "approve"
          description: Type d'événement ayant déclenché l'appel webhook
          enum:
            - create
            - update
            - transfer
            - submit
            - approve
            - refuse
            - request_changes
            - revoke
            - archive
            - reopen
            - cancel_reopening
        status_code:
          type: integer
          example: 200
          description: Code HTTP de la réponse du webhook
          nullable: true
        response_body:
          type: string
          example: '{"success": true}'
          description: Corps de la réponse du webhook
          nullable: true
        created_at:
          type: string
          format: date-time
          description: Date et heure de l'appel webhook
        authorization_request_id:
          type: integer
          example: 456
          description: Identifiant de la demande d'habilitation concernée par l'appel webhook
      required:
        - id
        - event
        - created_at
        - authorization_request_id

  responses:
    NotFoundError:
      description: Resource non trouvée
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    UnauthorizedError:
      description: Accès non autorisé - le jeton n'est pas valide ou absent.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    ForbiddenError:
      description: >-
        Accès interdit - le jeton ne porte pas le scope exigé, ou l'application n'a pas le droit actif correspondant
        pour le fournisseur de données concerné (titre « Droit API manquant »), ou le compte propriétaire du jeton
        a été banni de DataPass (erreur « Compte banni »).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    ValidationError:
      description: >-
        La sauvegarde ou la mise à jour a échoué : le payload ne respecte pas la définition, ou les données
        ne passent pas les validations d’une demande en brouillon (erreur « Demande invalide »). Les validations
        complètes ont lieu à la soumission. Un payload accepté auparavant peut désormais être rejeté. Les règles d’accès du formulaire web
        s’appliquent aussi : formulaire non ouvert aux demandeurs, organisation fermée, demande unique
        déjà existante pour l’organisation, demandeur exclu, et demande modifiable uniquement en état
        `draft` ou `changes_requested` (erreur « État non modifiable » sinon).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

paths:
  /oauth/token:
    post:
      summary: Obtenir un jeton OAuth2
      description: |
        Obtenir un jeton OAuth2 pour accéder aux ressources de l'API.
      tags:
        - Authentification
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - grant_type
                - client_id
                - client_secret
              properties:
                grant_type:
                  type: string
                  description: Type de demande OAuth2 (actuellement seul 'client_credentials' est supporté)
                  example: client_credentials
                client_id:
                  type: string
                  description: Identifiant du client OAuth2
                  example: "abc123def456"
                client_secret:
                  type: string
                  description: Secret du client OAuth2
                  example: "secret_token_value"
                scope:
                  type: string
                  description: Scopes demandés pour le jeton, séparés par des espaces. Omis, le jeton reçoit `public read_authorizations`. Les clefs API créées depuis « Mes clefs d'accès API » peuvent demander `public`, `read_authorizations` et `read_webhooks`.
                  example: "read_authorizations read_webhooks"
      responses:
        200:
          description: Jeton d'accès obtenu avec succès
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    description: Jeton d'accès à utiliser pour les requêtes authentifiées
                    example: "eyJhbGciOiJIUzI1NiJ9..."
                  token_type:
                    type: string
                    description: Type de jeton
                    example: "Bearer"
                  expires_in:
                    type: integer
                    description: Durée de validité du jeton en secondes
                    example: 7200
                  created_at:
                    type: integer
                    description: Timestamp de création du jeton
                    example: 1613749329
                  scope:
                    type: string
                    description: Scopes effectivement accordés au jeton, séparés par des espaces
                    example: "read_authorizations read_webhooks"
                required:
                  - access_token
                  - token_type
        400:
          description: Paramètres de demande invalides
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        401:
          description: Authentification échouée (client_id ou client_secret invalide)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /demandes:
    get:
      summary: Liste des demandes d'habilitations
      description: Récupère la liste des demandes d'habilitations associées aux droits développeur de l'utilisateur. La réponse inclut les habilitations, l'organisation et les événements associés à chaque demande. Les résultats sont triés par date de création décroissante (les plus récentes en premier).
      tags:
        - Demandes d'habilitations
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - name: limit
          in: query
          description: Nombre maximum de demandes à récupérer
          required: false
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 1000
        - name: offset
          in: query
          description: Nombre de demandes à sauter avant de commencer à récupérer les résultats
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: state
          in: query
          description: "Filtrer les demandes par statut (ex: draft, submitted, validated, refused, archived, revoked). Peut être un tableau (ex: state[]=draft&state[]=submitted) ou une valeur unique"
          required: false
          schema:
            oneOf:
              - type: string
                enum: [draft, submitted, changes_requested, validated, refused, archived, revoked]
              - type: array
                items:
                  type: string
                  enum: [draft, submitted, changes_requested, validated, refused, archived, revoked]
        - name: siret
          in: query
          description: "Filtrer les demandes par SIRET de l'organisation (ex: 13002526500013)"
          required: false
          schema:
            type: string
            example: "13002526500013"
      responses:
        200:
          description: Liste des demandes récupérée avec succès
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Demande"
        401:
          $ref: "#/components/responses/UnauthorizedError"
        403:
          $ref: "#/components/responses/ForbiddenError"
        404:
          $ref: "#/components/responses/NotFoundError"
    post:
      summary: Créer une demande d'habilitation
      description: |
        Crée une nouvelle demande d'habilitation en état `draft`.

        Le demandeur (applicant) est créé s'il n'existe pas, identifié par email.
        L'organisation est créée si elle n'existe pas, identifiée par SIRET, et rafraîchie depuis l'INSEE avant l'envoi du webhook `create` ; si l'INSEE est indisponible, le rafraîchissement est reporté.

        Le webhook `create` est déclenché avec `source: "api"`. Les abonnements `create` existants reçoivent donc les créations faites par API.
        Si aucun lien n'existe entre le demandeur et l'organisation, un lien non vérifié est créé.
        Ce lien ne devient vérifié qu'à la première connexion ProConnect du demandeur, si le fournisseur d'identité vérifie le SIRET ; tant qu'il ne l'est pas, le demandeur ne voit pas les autres demandes de l'organisation.

        Requiert le scope OAuth2 `write_authorizations` et que l'utilisateur propriétaire de l'application OAuth2 ait le rôle développeur pour le type de demande concerné.
      tags:
        - Demandes d'habilitations
      security:
        - OAuth2:
            - write_authorizations
      parameters:
        - $ref: '#/components/parameters/Authorization'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - demande
              properties:
                demande:
                  type: object
                  required:
                    - applicant
                    - organization
                  properties:
                    form_uid:
                      type: string
                      description: Identifiant du formulaire. Obligatoire si `type` n'est pas fourni.
                      example: "api-entreprise"
                    type:
                      type: string
                      description: Type de demande (snake_case). Le formulaire par défaut sera utilisé. Obligatoire si `form_uid` n'est pas fourni.
                      example: "api_entreprise"
                    applicant:
                      type: object
                      required:
                        - email
                        - given_name
                        - family_name
                      properties:
                        email:
                          type: string
                          example: "demandeur@example.com"
                        given_name:
                          type: string
                          example: "Jean"
                        family_name:
                          type: string
                          example: "Dupont"
                        job_title:
                          type: string
                          example: "Responsable informatique"
                        phone_number:
                          type: string
                          example: "0612345678"
                    organization:
                      type: object
                      required:
                        - siret
                      properties:
                        siret:
                          type: string
                          example: "13002526500013"
                    data:
                      type: object
                      description: Données du formulaire. Les clés doivent correspondre aux attributs définis pour la définition d'habilitation. Voir /defintions/{id} pour le détail des clés nécessaires.
                      additionalProperties: true
                    metadata:
                      $ref: '#/components/schemas/Metadata'
      responses:
        201:
          description: Demande d'habilitation créée avec succès
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Demande"
        401:
          $ref: "#/components/responses/UnauthorizedError"
        403:
          $ref: "#/components/responses/ForbiddenError"
        422:
          $ref: "#/components/responses/ValidationError"
  /demandes/{id}:
    get:
      summary: Récupérer une demande d'habilitation
      description: Récupère les détails d'une demande d'habilitation spécifique. La réponse inclut les habilitations, l'organisation et les événements associés à la demande.
      tags:
        - Demandes d'habilitations
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - name: id
          in: path
          description: Identifiant de la demande d'habilitation
          required: true
          schema:
            type: string
      responses:
        200:
          description: Demande d'habilitation
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Demande"
        403:
          $ref: "#/components/responses/ForbiddenError"
        404:
          $ref: "#/components/responses/NotFoundError"
    patch:
      summary: Mettre à jour une demande d'habilitation
      description: |
        Met à jour les données d'une demande d'habilitation existante.

        Seules les données et les documents peuvent être modifiés. Le demandeur et l'organisation ne peuvent pas être changés.

        Une mise à jour déclenche le webhook `update` avec `source: "api"`, même si aucune donnée ne change.

        La mise à jour n'est autorisée que si la demande est en état `draft` ou `changes_requested`, comme dans l'interface. Dans tout autre état, notamment `submitted`, la réponse est une erreur `422` « État non modifiable ».
        La liste de l'ensemble des états possibles d'une demande sont documentés ici https://datapass.api.gouv.fr/developpeurs/webhooks/documentation#tats-possibles-dune-demande-dhabilitation

        Requiert le scope OAuth2 write_authorizations et que l'utilisateur propriétaire de l'application OAuth2 ait le rôle développeur pour le type de demande concerné.
      tags:
        - Demandes d'habilitations
      security:
        - OAuth2:
            - write_authorizations
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - name: id
          in: path
          description: Identifiant de la demande d'habilitation
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - demande
              properties:
                demande:
                  type: object
                  properties:
                    data:
                      type: object
                      description: Données du formulaire à mettre à jour. Les clés doivent correspondre aux attributs définis pour le type de demande.
                      additionalProperties: true
                    metadata:
                      $ref: '#/components/schemas/Metadata'
      responses:
        200:
          description: Demande d'habilitation mise à jour avec succès
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Demande"
        401:
          $ref: "#/components/responses/UnauthorizedError"
        403:
          $ref: "#/components/responses/ForbiddenError"
        404:
          $ref: "#/components/responses/NotFoundError"
        422:
          $ref: "#/components/responses/ValidationError"

  /demandes/{id}/soumettre:
    post:
      summary: Soumettre une demande d'habilitation
      description: |
        Soumet pour instruction une demande complète, au nom du demandeur indiqué à la création. L'API ne soumet jamais au nom du fournisseur de données.

        Le fournisseur de données déclare, dans `consentement`, avoir recueilli le consentement du demandeur : chaque case à cocher que le demandeur doit cocher dans l'interface avant de soumettre (conditions générales d'utilisation, information du délégué à la protection des données, cases propres à certains types d'habilitation…) doit être transmise à `true`. Les cases exigées dépendent du type d'habilitation et sont listées dans `consentements` de `GET /definitions/{id}`. Une case exigée absente ou à `false` empêche la soumission.

        La création (et les mises à jour du brouillon) et la soumission sont deux appels distincts, que le fournisseur choisit d'enchaîner ou non.

        La demande est contrôlée avec les mêmes règles que la soumission dans l'interface (champs obligatoires, emails de contact vérifiés, pièces jointes). Le fournisseur de données peut toutefois déclarer avoir lui-même vérifié les emails de contact en transmettant `verified_email: true` : la vérification de joignabilité effectuée par DataPass est alors ignorée. Si elle est incomplète, rien n'est soumis : elle reste dans son état et la réponse `422` liste les erreurs, une par champ, avec leur `source.pointer`.

        La soumission n'est possible que depuis les états où le demandeur peut soumettre dans l'interface : `draft` ou `changes_requested`. Dans tout autre état, la réponse est une erreur `422` et l'état ne change pas.

        Seules les demandes créées par API (`POST /demandes`) peuvent être soumises par API : un brouillon commencé par le demandeur dans DataPass lui reste réservé, car le consentement recueilli par le fournisseur de données porte sur les demandes qu'il a créées. Sinon, la réponse est une erreur `403` (titre « Demande non créée par API ») et la demande ne change pas.

        Après la soumission, la demande est en état `submitted` et déclenche les mêmes effets qu'une soumission dans l'interface : webhook `submit`, et notifications selon le paramètre `notifications` et le contrat du fournisseur de données. L'historique indique que la demande a été soumise par API, au nom du demandeur, et par quelle application.

        Requiert le scope OAuth2 `submit_authorizations` et un droit de soumission actif pour le fournisseur de données du type de demande, accordé par un administrateur DataPass. Sinon, la réponse est `403`.
      tags:
        - Demandes d'habilitations
      security:
        - OAuth2:
            - submit_authorizations
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - name: id
          in: path
          description: Identifiant de la demande d'habilitation
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - consentement
              properties:
                consentement:
                  type: object
                  description: Cases à cocher de la soumission, recueillies par le fournisseur de données auprès du demandeur. Les clés sont celles de `consentements` dans `GET /definitions/{id}`.
                  additionalProperties:
                    type: boolean
                  example:
                    terms_of_service_accepted: true
                    data_protection_officer_informed: true
                verified_email:
                  type: boolean
                  default: false
                  description: Le fournisseur de données déclare avoir vérifié les emails de contact de la demande. À `true`, DataPass n'effectue pas sa propre vérification de joignabilité de ces emails ; le format reste contrôlé. L'historique de la demande indique que les emails ont été déclarés vérifiés par le fournisseur de données.
                notifications:
                  $ref: '#/components/schemas/Notifications'
      responses:
        200:
          description: Demande soumise avec succès. La réponse contient la demande à jour, en état `submitted`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Demande"
        401:
          $ref: "#/components/responses/UnauthorizedError"
        403:
          $ref: "#/components/responses/ForbiddenError"
        404:
          $ref: "#/components/responses/NotFoundError"
        422:
          description: |
            La demande n'a pas été soumise : elle est incomplète ou invalide (une erreur par champ, titre « Demande invalide »), ou elle n'est pas dans un état soumettable (titre « État non modifiable »).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                champ_manquant:
                  summary: Délégué à la protection des données non renseigné
                  value:
                    errors:
                      - status: "422"
                        title: "Demande invalide"
                        detail: "Nom de famille du délégué à la protection des données doit être rempli(e)"
                        source:
                          pointer: "/data/delegue_protection_donnees_family_name"
                consentement_manquant:
                  summary: Case de consentement non transmise
                  value:
                    errors:
                      - status: "422"
                        title: "Consentement manquant"
                        detail: "La case « terms_of_service_accepted » doit être cochée pour soumettre cette demande."
                        source:
                          pointer: "/consentement/terms_of_service_accepted"
                etat_non_soumettable:
                  summary: Demande déjà en instruction
                  value:
                    errors:
                      - status: "422"
                        title: "État non modifiable"
                        detail: "La demande ne peut pas être modifiée dans l'état actuel."

  /demandes/{id}/valider:
    post:
      summary: Valider une demande d'habilitation
      description: |
        Valide une demande en cours d'instruction, au nom d'un instructeur identifié qui en prend la responsabilité. Peu importe que la décision vienne de règles automatiques ou du portail du fournisseur de données, tant qu'une personne en porte la responsabilité.

        L'instructeur est désigné par son adresse email (`instructeur.email`) : ce doit être un compte DataPass existant qui a le rôle d'instructeur pour le type de la demande. Sinon, la réponse est une erreur `422` « informations de l'instructeur manquantes ou invalides » et la demande ne change pas.

        Seules les demandes en état `submitted` peuvent être validées par API. Une demande `changes_requested`, `draft`, `refused` ou `validated` renvoie une erreur `422` et ne change pas. Le refus, la demande de modification et la révocation ne sont pas possibles par API : ils se font dans l'interface DataPass.

        La validation produit exactement les mêmes effets qu'une validation dans l'interface : création de l'habilitation, passage des habilitations précédentes en `obsolete`, passerelles, webhook `approve`, habilitation FranceConnect liée le cas échéant. L'historique affiche le nom de l'instructeur, la mention que la validation a été faite par API, et l'application appelante.

        Requiert le scope OAuth2 `validate_authorizations` et un droit de validation actif pour le fournisseur de données du type de demande, accordé par un administrateur DataPass. Sinon, la réponse est `403`.
      tags:
        - Demandes d'habilitations
      security:
        - OAuth2:
            - validate_authorizations
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - name: id
          in: path
          description: Identifiant de la demande d'habilitation
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - instructeur
              properties:
                instructeur:
                  type: object
                  required:
                    - email
                  properties:
                    email:
                      type: string
                      description: Email du compte DataPass de l'instructeur qui valide.
                      example: "instructeur@example.com"
                message:
                  type: string
                  description: Message de validation facultatif, comme dans l'interface.
                  example: "Demande conforme au cadre juridique."
                notifications:
                  $ref: '#/components/schemas/Notifications'
      responses:
        200:
          description: Demande validée avec succès. La réponse contient la demande à jour, en état `validated`, avec l'habilitation active créée dans `habilitations`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Demande"
        401:
          $ref: "#/components/responses/UnauthorizedError"
        403:
          $ref: "#/components/responses/ForbiddenError"
        404:
          $ref: "#/components/responses/NotFoundError"
        422:
          description: |
            La demande n'a pas été validée : instructeur manquant ou invalide (ou sans rôle d'instructeur sur ce type), ou demande qui n'est pas en état `submitted` (titre « État non modifiable »).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                instructeur_invalide:
                  summary: Instructeur inconnu ou sans rôle sur ce type
                  value:
                    errors:
                      - status: "422"
                        title: "Instructeur invalide"
                        detail: "Informations de l'instructeur manquantes ou invalides."
                        source:
                          pointer: "/instructeur/email"

  /demandes/{id}/events:
    get:
      summary: Récupérer les événements associés à une demande d'habilitation
      description: Récupère la liste des événements associés à une demande d'habilitation spécifique.
      tags:
        - Événements
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - name: id
          in: path
          required: true
          description: Identifiant de la demande d'habilitation
          schema:
            type: string
      responses:
        200:
          description: Liste des événements associés à la demande
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuthorizationRequestEvent'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        403:
          $ref: '#/components/responses/ForbiddenError'
        404:
          $ref: '#/components/responses/NotFoundError'

  /habilitations:
    get:
      summary: Liste des habilitations
      description: Récupère la liste des habilitations auxquelles l'utilisateur a accès. Les résultats sont triés par date de création décroissante (les plus récentes en premier).
      tags:
        - Habilitations
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - name: limit
          in: query
          description: Nombre maximum d'habilitations à récupérer
          required: false
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 1000
        - name: offset
          in: query
          description: Nombre d'habilitations à sauter avant de commencer à récupérer les résultats
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: state
          in: query
          description: "Filtrer les habilitations par statut (ex: active, obsolete, revoked). Peut être un tableau (ex: state[]=active&state[]=obsolete) ou une valeur unique"
          required: false
          schema:
            oneOf:
              - type: string
                enum: [active, obsolete, revoked]
              - type: array
                items:
                  type: string
                  enum: [active, obsolete, revoked]
        - name: siret
          in: query
          description: "Filtrer les habilitations par SIRET de l'organisation (ex: 13002526500013)"
          required: false
          schema:
            type: string
            example: "13002526500013"
      responses:
        200:
          description: Liste des habilitations récupérée avec succès
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: "#/components/schemas/HabilitationDetailed"
        401:
          $ref: "#/components/responses/UnauthorizedError"
        403:
          $ref: "#/components/responses/ForbiddenError"

  /habilitations/{id}:
    get:
      summary: Récupérer une habilitation
      description: Récupère les détails d'une habilitation spécifique.
      tags:
        - Habilitations
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - name: id
          in: path
          description: Identifiant de l'habilitation
          required: true
          schema:
            type: string
      responses:
        200:
          description: Habilitation récupérée avec succès
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/HabilitationDetailed"
        401:
          $ref: "#/components/responses/UnauthorizedError"
        403:
          $ref: "#/components/responses/ForbiddenError"
        404:
          $ref: "#/components/responses/NotFoundError"

  /me:
    get:
      summary: Récupérer les informations de l'utilisateur courant
      description: Récupère les informations de l'utilisateur associé au token d'authentification.
      tags:
        - Utilisateurs
      security:
        - OAuth2:
            - public
      parameters:
        - $ref: '#/components/parameters/Authorization'
      responses:
        200:
          description: Informations de l'utilisateur
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        401:
          $ref: "#/components/responses/UnauthorizedError"
        403:
          $ref: "#/components/responses/ForbiddenError"

  /definitions:
    get:
      summary: Liste des définitions d'habilitations
      description: |
        Récupère la liste des définitions d'habilitations auxquelles l'utilisateur a accès en tant que développeur.

        Les définitions d'habilitations décrivent les types d'habilitations disponibles, leurs caractéristiques,
        leurs étapes (sandbox/production) et les données auxquelles elles permettent d'accéder.

        L'accès aux définitions est filtré en fonction des droits développeur de l'utilisateur.
        Seules les définitions pour lesquelles l'utilisateur a un rôle développeur sont retournées.
      tags:
        - Définitions d'habilitations
      parameters:
        - $ref: '#/components/parameters/Authorization'
      responses:
        200:
          description: Liste des définitions d'habilitations récupérée avec succès
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuthorizationDefinition"
              examples:
                single_stage:
                  summary: Définition simple (API Entreprise)
                  value:
                    - id: "api_entreprise"
                      name: "API Entreprise"
                      name_with_stage: "API Entreprise"
                      multi_stage?: false
                      data: ["intitule", "description", "destinataire_donnees_caractere_personnel", "duree_conservation_donnees_caractere_personnel", "duree_conservation_donnees_caractere_personnel_justification", "cadre_juridique_url", "cadre_juridique_nature", "date_prevue_mise_en_production", "volumetrie_approximative", "scopes"]
                      scopes:
                        - name: "Unités légales et établissements INSEE"
                          value: "unites_legales_etablissements_insee"
                          group: "Informations générales"
                          link: null
                          included: false
                          disabled: false
                          deprecated: false
                          deprecated_date: null
                multi_stage:
                  summary: Définitions multi-étapes (API Impôt Particulier)
                  value:
                    - id: "api_impot_particulier_sandbox"
                      name: "API Impôt Particulier"
                      name_with_stage: "API Impôt Particulier (Bac à sable)"
                      multi_stage?: true
                      data: ["intitule", "description", "destinataire_donnees_caractere_personnel", "duree_conservation_donnees_caractere_personnel", "duree_conservation_donnees_caractere_personnel_justification", "cadre_juridique_url", "cadre_juridique_nature", "date_prevue_mise_en_production", "volumetrie_approximative", "scopes"]
                      scopes:
                        - name: "Revenu fiscal de référence"
                          value: "dgfip_rfr"
                          group: "Données fiscales"
                          link: null
                          included: false
                          disabled: false
                          deprecated: false
                          deprecated_date: null
                    - id: "api_impot_particulier"
                      name: "API Impôt Particulier"
                      name_with_stage: "API Impôt Particulier (Production)"
                      multi_stage?: true
                      data: ["intitule", "description", "destinataire_donnees_caractere_personnel", "duree_conservation_donnees_caractere_personnel", "duree_conservation_donnees_caractere_personnel_justification", "cadre_juridique_url", "cadre_juridique_nature", "date_prevue_mise_en_production", "volumetrie_approximative", "scopes"]
                      scopes:
                        - name: "Revenu fiscal de référence"
                          value: "dgfip_rfr"
                          group: "Données fiscales"
                          link: null
                          included: false
                          disabled: false
                          deprecated: false
                          deprecated_date: null
        401:
          $ref: "#/components/responses/UnauthorizedError"
        403:
          $ref: "#/components/responses/ForbiddenError"

  /definitions/{id}:
    get:
      tags:
        - Définitions d'habilitations
      summary: Récupérer une définition d'habilitation spécifique
      description: |
        Récupère les détails d'une définition d'habilitation spécifique par son identifiant.

        L'utilisateur doit avoir un rôle développeur pour le type d'habilitation correspondant.
        Si l'utilisateur n'a pas accès à cette définition, une erreur 404 est retournée.

        Pour les définitions multi-étapes (comme API Impôt Particulier), chaque étape (sandbox/production)
        a son propre identifiant et ses propres informations de stage.
      operationId: getAuthorizationDefinition
      security:
        - OAuth2:
            - read_authorizations
      parameters:
        - name: id
          in: path
          required: true
          description: Identifiant unique de la définition d'habilitation
          schema:
            type: string
            example: api_impot_particulier_sandbox
      responses:
        '200':
          description: Définition d'habilitation récupérée avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationDefinition'
              examples:
                single_stage:
                  summary: Définition simple (API Entreprise)
                  value:
                    id: api_entreprise
                    name: API Entreprise
                    name_with_stage: API Entreprise
                    multi_stage?: false
                    data: ["intitule", "description", "destinataire_donnees_caractere_personnel", "duree_conservation_donnees_caractere_personnel", "duree_conservation_donnees_caractere_personnel_justification", "cadre_juridique_url", "cadre_juridique_nature", "date_prevue_mise_en_production", "volumetrie_approximative", "scopes"]
                    scopes:
                      - name: "Unités légales et établissements INSEE"
                        value: "unites_legales_etablissements_insee"
                        group: "Informations générales"
                        link: null
                        included: false
                        disabled: false
                        deprecated: false
                        deprecated_date: null
                multi_stage_sandbox:
                  summary: Définition multi-étapes - Sandbox (API Impôt Particulier)
                  value:
                    id: api_impot_particulier_sandbox
                    name: API Impôt Particulier
                    name_with_stage: API Impôt Particulier (Bac à sable)
                    multi_stage?: true
                    data: ["intitule", "description", "destinataire_donnees_caractere_personnel", "duree_conservation_donnees_caractere_personnel", "duree_conservation_donnees_caractere_personnel_justification", "cadre_juridique_url", "cadre_juridique_nature", "date_prevue_mise_en_production", "volumetrie_approximative", "scopes"]
                    scopes:
                      - name: "Revenu fiscal de référence"
                        value: "dgfip_rfr"
                        group: "Données fiscales"
                        link: null
                        included: false
                        disabled: false
                        deprecated: false
                        deprecated_date: null
                multi_stage_production:
                  summary: Définition multi-étapes - Production (API Impôt Particulier)
                  value:
                    id: api_impot_particulier
                    name: API Impôt Particulier
                    name_with_stage: API Impôt Particulier (Production)
                    multi_stage?: true
                    data: ["intitule", "description", "destinataire_donnees_caractere_personnel", "duree_conservation_donnees_caractere_personnel", "duree_conservation_donnees_caractere_personnel_justification", "cadre_juridique_url", "cadre_juridique_nature", "date_prevue_mise_en_production", "volumetrie_approximative", "scopes"]
                    scopes:
                      - name: "Revenu fiscal de référence"
                        value: "dgfip_rfr"
                        group: "Données fiscales"
                        link: null
                        included: false
                        disabled: false
                        deprecated: false
                        deprecated_date: null
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Définition d'habilitation non trouvée ou accès non autorisé

fr:
  api_errors:
    form_not_found:
      title: Formulaire introuvable
      detail: Le formulaire demandé est introuvable.
    unauthorized_type:
      title: Non autorisé
      detail: Vous n’avez pas les droits pour créer ce type de demande.
    dead_end_state:
      title: État non modifiable
      detail: La demande ne peut pas être modifiée dans l’état actuel.
    form_not_startable:
      title: Formulaire non disponible
      detail: Ce formulaire ne peut pas être utilisé pour créer une demande.
    organization_closed:
      title: Organisation fermée
      detail: L’organisation indiquée est fermée, aucune demande ne peut être créée pour elle.
    applicant_banned:
      title: Demandeur invalide
      detail: Ce demandeur ne peut pas être utilisé.
    unicity_violated:
      title: Demande déjà existante
      detail: Une autre demande d’habilitation de ce type est déjà en cours ou validée pour cette organisation, elle ne peut en avoir qu’une seule.
    instructor_invalid:
      title: Instructeur invalide
      detail: Les informations de l’instructeur sont manquantes ou invalides.
    not_approvable_from_api:
      title: État non modifiable
      detail: Seule une demande en cours d’instruction peut être validée par API.
    trigger_event_failed:
      title: Transition impossible
      detail: La demande n’a pas pu changer d’état, aucune modification n’a été enregistrée.
    invalid_data_keys:
      title: Clé invalide
      detail: "La clé « %{key} » n’existe pas pour ce type de demande."
    applicant_invalid:
      title: Demandeur invalide
    organization_invalid:
      title: Organisation invalide
    authorization_request_invalid:
      title: Demande invalide
    consent_missing:
      title: Consentement manquant
      detail: "La case « %{key} » doit être cochée pour soumettre cette demande."
    generic:
      title: Entité non traitable
      detail: Un problème est survenu lors du traitement de la requête.
    banned_token_owner:
      title: Compte banni
      detail: Le compte propriétaire de ce jeton d’accès a été banni de DataPass.
    not_found:
      title: Non trouvé
      detail: La ressource demandée est introuvable.
    token_missing:
      title: Non autorisé
      detail: Un jeton d’accès est requis mais absent dans les en-têtes de la requête.
    token_expired:
      title: Jeton expiré
      detail: Le jeton d’accès a expiré. Veuillez en obtenir un nouveau.
    parameter_missing:
      title: Paramètre manquant
      detail: "Le paramètre « %{param} » est requis mais absent de la requête."
    api_access_denied:
      title: Droit API manquant
      detail:
        submit: Votre application n’est pas autorisée à soumettre des demandes pour ce fournisseur de données.
        validate: Votre application n’est pas autorisée à valider des demandes pour ce fournisseur de données.
        missing_scope: Le jeton d’accès ne permet pas cette action. Si un droit vient d’être accordé à votre application, demandez un nouveau jeton d’accès.
        default: Votre application n’a pas le droit d’effectuer cette action.

api_particulier_demarche_numerique:
  name: "API Particulier via Démarche numérique"
  description: "Intégrez API Particulier à votre démarche administrative en ligne réalisée via Démarche numérique pour récupérer, à la place des usagers, leurs informations administratives (quotient familial CAF, composition familiale, statut demandeur d’emploi, étudiant et étudiant boursier) et réaliser leurs démarches en toute simplicité."
  cgu_link: "https://particulier.api.gouv.fr/cgu"
  provider: "dinum"
  link: "https://api.gouv.fr/les-api/api-particulier"
  access_link: https://particulier.api.gouv.fr/compte/jetons/%{external_provider_id}
  kind: "api"
  public: true
  support_email: "support@particulier.api.gouv.fr"
  features:
    instructor_drafts: true
  blocks:
    - name: "basic_infos"
    - name: "personal_data"
    - name: "legal"
    - name: "modalities"
    - name: "scopes"
    - name: "contacts"
  scopes:
    - &api_particulier_france_connect_accessible_scopes_1
      - name: "Quotient familial CAF & MSA"
        value: "cnaf_quotient_familial"
        group: "API Quotient familial"
        provider_label: "CNAF & MSA"
      - name: "Identités allocataire et conjoint"
        value: "cnaf_allocataires"
        group: "API Quotient familial"
        provider_label: "CNAF & MSA"
      - name: "Identités enfants"
        value: "cnaf_enfants"
        group: "API Quotient familial"
        provider_label: "CNAF & MSA"
      - name: "Adresse du foyer"
        value: "cnaf_adresse"
        group: "API Quotient familial"
        provider_label: "CNAF & MSA"
    - &api_particulier_france_connect_accessible_scopes_2
      - name: "Statut étudiant boursier"
        value: "cnous_statut_boursier"
        group: "API Statut étudiant boursier"
        provider_label: "CNOUS"
      - name: "Échelon de la bourse"
        value: "cnous_echelon_bourse"
        group: "API Statut étudiant boursier"
        provider_label: "CNOUS"
      - name: "Identité"
        value: "cnous_identite"
        group: "API Statut étudiant boursier"
        provider_label: "CNOUS"
      - name: "E-mail"
        value: "cnous_email"
        group: "API Statut étudiant boursier"
        provider_label: "CNOUS"
      - name: "Période de versement"
        value: "cnous_periode_versement"
        group: "API Statut étudiant boursier"
        provider_label: "CNOUS"
      - name: "Ville d‘études et établissement"
        value: "cnous_ville_etudes"
        group: "API Statut étudiant boursier"
        provider_label: "CNOUS"
      - name: "Identifiant national étudiant (INE)"
        value: "cnous_ine"
        group: "API Statut étudiant boursier"
        provider_label: "CNOUS"

      - name: "Identité de l'étudiant"
        value: "mesri_identite"
        group: "API Statut étudiant"
        provider_label: "Min. enseignement supérieur"
      - name: "Liste des admissions de l'étudiant"
        value: "mesri_admissions"
        group: "API Statut étudiant"
        provider_label: "Min. enseignement supérieur"
      - name: "Statut inscrit"
        description: "Pour chacune des admissions retournées, indique si le statut de l'étudiant est passé à inscrit."
        value: "mesri_admission_inscrit"
        group: "API Statut étudiant"
        provider_label: "Min. enseignement supérieur"
      - name: "Régime de formation"
        value: "mesri_admission_regime_formation"
        group: "API Statut étudiant"
        provider_label: "Min. enseignement supérieur"
      - name: "Code COG Insee de la commune de l'établissement"
        value: "mesri_admission_commune_etudes"
        group: "API Statut étudiant"
        provider_label: "Min. enseignement supérieur"
      - name: "Appelation et code UAI de l'établissement"
        value: "mesri_admission_etablissement_etudes"
        group: "API Statut étudiant"
        provider_label: "Min. enseignement supérieur"

      - name: "Statut C2S"
        value: "complementaire_sante_solidaire"
        group: "API Complémentaire Santé Solidaire"
        provider_label: "Sécurité sociale"

      - name: "Statut RSA"
        value: "revenu_solidarite_active"
        group: "API Revenue de Solidarité Active"
        provider_label: "CNAF & MSA"
      - name: "Majoration RSA"
        value: "revenu_solidarite_active_majoration"
        group: "API Revenue de Solidarité Active"
        provider_label: "CNAF & MSA"

      - name: "Statut Prime d'activité"
        value: "prime_activite"
        group: "API Prime d'Activité"
        provider_label: "CNAF & MSA"
      - name: "Majoration Prime d'activité"
        value: "prime_activite_majoration"
        group: "API Prime d'Activité"
        provider_label: "CNAF & MSA"

      - name: "Statut ASF"
        value: "allocation_soutien_familial"
        group: "API Allocation Soutien Familial"
        provider_label: "CNAF & MSA"

      - name: "Statut AAH"
        value: "allocation_adulte_handicape"
        group: "API Allocation Adulte Handicapé"
        provider_label: "CNAF & MSA"

      - name: "Statut AEEH"
        value: "cnav_allocation_enfant_handicape"
        group: "API Allocation d'Éducation de l'Enfant Handicapé"
        provider_label: "CNAV"

      - name: "Statut allocation de rentrée scolaire"
        value: "cnav_allocation_rentree_scolaire"
        group: "API Statut allocation de rentrée scolaire"
        provider_label: "CNAV"

      - name: "Statut Service National"
        value: "dsnj_statut_service_national"
        group: "API Service National"
        provider_label: "DSNJ"
    - &api_particulier_france_connect_accessible_scopes_3
      - name: "Extrait d'immatriculation de véhicule - Identité du particulier"
        value: "ants_extrait_immatriculation_vehicule_identite_particulier"
        group: "API Extrait d'immatriculation de véhicule"
        provider_label: "ANTS"
      - name: "Extrait d'immatriculation de véhicule - Adresse du particulier"
        value: "ants_extrait_immatriculation_vehicule_adresse_particulier"
        group: "API Extrait d'immatriculation de véhicule"
        provider_label: "ANTS"
      - name: "Extrait d'immatriculation de véhicule - Statut de rattachement"
        value: "ants_extrait_immatriculation_vehicule_statut_rattachement"
        group: "API Extrait d'immatriculation de véhicule"
        provider_label: "ANTS"
      - name: "Extrait d'immatriculation de véhicule - Données d'immatriculation du véhicule"
        value: "ants_extrait_immatriculation_vehicule_donnees_immatriculation_vehicule"
        group: "API Extrait d'immatriculation de véhicule"
        provider_label: "ANTS"
      - name: "Extrait d'immatriculation de véhicule - Caractéristiques techniques du véhicule"
        value: "ants_extrait_immatriculation_vehicule_caracteristiques_techniques_vehicule"
        group: "API Extrait d'immatriculation de véhicule"
        provider_label: "ANTS"

      - name: "Identités allocataire et conjoint"
        value: "cnav_participation_familiale_eaje_allocataires"
        group: "API Participation familiale EAJE"
        provider_label: "CNAV"
      - name: "Identités enfants"
        value: "cnav_participation_familiale_eaje_enfants"
        group: "API Participation familiale EAJE"
        provider_label: "CNAV"
      - name: "Adresse du foyer"
        value: "cnav_participation_familiale_eaje_adresse"
        group: "API Participation familiale EAJE"
        provider_label: "CNAV"
      - name: "Paramètres pris en compte pour le calcul du tarif"
        value: "cnav_participation_familiale_eaje_parametres_calcul"
        group: "API Participation familiale EAJE"
        provider_label: "CNAV"

api_particulier:

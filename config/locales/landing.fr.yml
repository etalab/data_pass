fr:
  pages:
    home:
      notice:
        title: Le registre des parties utilisatrices du portefeuille européen ouvre le 24 décembre 2026.
        link: Découvrir le registre du portefeuille européen
      hero:
        kicker: DataPass, à quoi ça sert ?
        title: Demander et accorder l’accès aux données publiques protégées
        lead: Certaines données publiques sont protégées par la loi. Les organisations qui en ont besoin demandent l’accès à l’administration qui les détient, et celle-ci instruit leurs demandes. DataPass réunit ces demandes et ces décisions au même endroit.
        applicants:
          title: Vous cherchez des données pour votre service
          description: "Collectivité, administration, entreprise ou éditeur de solution logicielle : trouvez les données publiques protégées et apprenez comment en demander l’accès."
          detail: Accéder à des données publiques protégées
        administrations:
          title: Vous êtes une administration qui détient des données
          description: Recevez et instruisez au même endroit les demandes d’accès à vos données.
          detail: Ce que DataPass vous apporte
        european_wallet:
          title: Votre organisation et le portefeuille européen
          description: Vous demanderez des données à vos usagers via leur portefeuille ou y délivrerez des attestations.
          detail: Découvrir le registre du portefeuille européen
          badge: Nouveau
      administrations:
        kicker: Vous êtes une administration qui détient des données
        title: Recevez et instruisez les demandes d’accès à vos données au même endroit
        lead: Les organisations vous écrivent par un formulaire construit avec vous, et vous décidez dans un espace réservé à votre administration.
        points:
          - Des demandes complètes, cadrées juridiquement
          - Chaque décision tracée et publiée pour vous
          - Vous restez seule juge de qui accède à vos données
        features_title: Ce que DataPass permet
        receive:
          title: Recevoir
          items:
            - "Un formulaire construit avec vous : cadre juridique, données personnelles, données demandées, contacts"
            - Toutes vos demandes au même endroit
            - Les demandeurs sont informés du délai d’instruction
        instruct:
          title: Instruire
          items:
            - Valider, refuser avec un motif, demander des modifications
            - Écrire au demandeur, avec des modèles de messages
            - Attribuez des rôles en fonction de votre organisation d’équipe
        follow:
          title: Suivre et rendre compte
          items:
            - Chaque habilitation délivrée, avec son historique et ses mises à jour
            - Une API et des notifications vers votre système d’information
            - La publication en open data des habilitations accordées entre administrations, comme l’exige l’article L114-8 du CRPA
        contact:
          kicker: Créer votre formulaire avec nous
          title: Des organisations vous demandent l’accès à vos données ?
          text: L’équipe DataPass construit avec votre administration le formulaire que ces organisations rempliront pour faire leur demande.
          button: Contactez-nous
          hints_title: Dans votre message, précisez
          hints:
            - les données que vous détenez ;
            - les organisations qui vous en demandent l’accès ;
            - le texte qui encadre cet accès, si vous le connaissez ; sinon, pas d’inquiétude, notre équipe vous accompagne.
